name: Auto merge

# Turns on GitHub's native auto-merge for pull requests that only add or correct
# list content, so a community entry lands as soon as the checks go green with
# nobody having to press a button. GitHub does the waiting: the merge fires when
# every required status check on `main` passes, and never before.
#
# Why an allowlist rather than "auto-merge everything". On a `pull_request` event
# the workflow definition comes from the pull request itself, so a fork can edit
# the very checks that judge it. Auto-merging such a change with no human in the
# loop would hand the repository to whoever opened it. So a pull request is only
# eligible when every file it touches is list content. Anything reaching
# `.github/`, `scripts/`, `tests/`, or the tooling config is left for a person.
#
# This runs on `pull_request_target`, which means the workflow definition comes
# from `main` and cannot be altered by a fork. It reads the changed-file list
# over the API and never checks out pull request code, so the writable token is
# never exposed to anything a contributor controls.
#
# A star is required: a pull request is only armed when its author has starred
# the repository (scripts/star_check.py --starred). Without one it waits, marked
# `missing-star` by star-check.yml, until they star, which releases it, or until
# a maintainer merges it by hand. A star never gets past a failing check: GitHub
# still waits for every required one before it merges.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# nothing by default; the job asks for exactly what it writes
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write # gh pr merge --auto needs it
      pull-requests: write
    steps:
      # `main`, not the pull request: on pull_request_target the default ref is
      # the base branch. Only main's star_check.py runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Decide eligibility and enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # optional: lets star_check.py read the stargazer list directly
          STARGAZERS_TOKEN: ${{ secrets.STARGAZERS_TOKEN }}
          # who switched auto-merge on, read by disarm()
          ARMED_BY_QUERY: >-
            query($owner: String!, $name: String!, $pr: Int!) {
            repository(owner: $owner, name: $name) { pullRequest(number: $pr) {
            autoMergeRequest { enabledBy { login } } } } }
        run: |
          set -euo pipefail

          # Files a pull request may touch and still merge unattended. Content
          # only: nothing here can change what the checks do.
          is_allowed() {
            case "$1" in
              README.md|CHANGELOG.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Every GitHub read below is its own assignment, never inside an `if` or
          # `< <(...)`, so a failed call fails this step under `set -e` instead of
          # reading as "not armed", "head moved" or "no files".

          # Switch off an auto-merge this workflow armed once a later file change or
          # stop label makes the pull request ineligible. Only the Actions bot's
          # own: one a maintainer armed by hand is theirs to keep.
          disarm() {
            local armed_by
            armed_by=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" \
              -f query="$ARMED_BY_QUERY" \
              --jq '.data.repository.pullRequest.autoMergeRequest.enabledBy.login // ""')
            if [ "$armed_by" = github-actions ]; then
              gh pr merge "$PR" --repo "$REPO" --disable-auto
              echo "Auto merge was on and is now off." >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            echo "## Auto merge"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # The file list belongs to whatever the head is when it is read, so it
          # must be this event's head before and after the read. A push in between
          # started a newer run, which decides instead.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Not decided here: the head moved past $HEAD_SHA, and the newer run decides." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          blocked=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! is_allowed "$f"; then
              blocked="$blocked$f"$'\n'
            fi
          done <<< "$files"

          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Not decided here: the head moved while its files were read, and the newer run decides." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$blocked" ]; then
            disarm
            {
              echo "Not enabled. This pull request changes files outside the list itself:"
              echo
              echo '```'
              printf '%s' "$blocked"
              echo '```'
              echo
              echo "Changes to workflows, scripts, tests or tooling config are reviewed"
              echo "by a maintainer, because they can alter what the checks verify."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case ",$LABELS," in
            *,no-auto-merge,*)
              disarm
              echo "Not enabled: the \`no-auto-merge\` label is set." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *,maintainer-override,*)
              disarm
              {
                echo "Not enabled: the \`maintainer-override\` label is set."
                echo
                echo "That label bypasses the submission gate, which is a maintainer's"
                echo "judgement call. Whoever applied it can merge by hand."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # No disarm here: issue-to-pr.yml and tidy.yml arm their own bot pull
          # requests, whose author never stars, and GitHub has no unstar event.
          if ! python scripts/star_check.py --starred "$AUTHOR"; then
            {
              echo "Not enabled: @$AUTHOR has not starred the repository (\`missing-star\`)."
              echo "A star is required before a pull request merges itself. Starring"
              echo "releases this one; a maintainer can also merge it by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # pinned: GitHub refuses to arm it if the head is no longer the checked one
          gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"

          {
            echo "Enabled. @$AUTHOR has starred and this pull request only touches list"
            echo "content, so GitHub will squash-merge it as soon as every required check"
            echo "passes. It will not merge while any required check is red."
            echo
            echo "To stop it, add the \`no-auto-merge\` label."
          } >> "$GITHUB_STEP_SUMMARY"
